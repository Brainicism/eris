name: Check For Updates

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check For Updates
    runs-on: ubuntu-latest
    steps:
     - name: Checkout,
       uses: actions/checkout@v2
       with:
        repository: 'DonovanDMC/ErisPRUpdateBot'
     - name: Echo Token
       run: echo $GH_TOKEN > token
     - name: Install Packages
       run: npm i
     - name: Run
       run: npx ts-node index.ts
    
